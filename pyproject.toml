[project]
name = "ontos"
version = "0.0.1"
description = "Knowledge-graph layer of Enclave's sovereign AI company brain. Audit-first, agent-native, in-VPC."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Enclave" }]

dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "networkx>=3.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
llama = ["llama-index>=0.11", "llama-index-graph-stores-neo4j>=0.3"]
langchain = ["langchain>=0.3", "langchain-experimental>=0.3"]
authz = ["openfga-sdk>=0.6"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx>=3.0",
    "types-PyYAML>=6.0",
    "neo4j>=5.20",
    "testcontainers[neo4j,postgres]>=4.8",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
]

[project.scripts]
ontos = "ontos.runtime.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (Docker + Neo4j, etc.)",
]
# Skip integration tests by default so `uv run pytest` stays fast for
# contributors without Docker running. CI runs both suites explicitly.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
