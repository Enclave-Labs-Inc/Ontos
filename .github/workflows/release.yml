name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate everything; skip PyPI + GHCR pushes."
        type: boolean
        default: true

permissions:
  contents: write   # for creating the GitHub Release
  packages: write   # for pushing to GHCR
  id-token: write   # for PyPI trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheels + verify version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # workflow_dispatch: dry-run; use whatever's in _version.py
            VERSION="$(python -c "import runpy; print(runpy.run_path('ontos/_version.py')['__version__'])")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Ontos v${VERSION}"

      - name: Verify tag matches ontos/_version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FILE_VERSION="$(python -c "import runpy; print(runpy.run_path('ontos/_version.py')['__version__'])")"
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: git tag v${TAG_VERSION} does not match ontos/_version.py (${FILE_VERSION})"
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    environment:
      name: pypi
      url: https://pypi.org/project/enclave-ontos/${{ needs.build.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password / API token: uses OIDC trusted publishing. Set up
        # the PyPI project once at pypi.org → Manage → Publishing →
        # Add a new publisher, GitHub, this repo, workflow=release.yml,
        # environment=pypi. See RELEASING.md.

  publish-ghcr:
    name: Build + push container to GHCR
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/ontos"
          # Force lowercase — GHCR requires lowercase image names.
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_version }}
            ${{ steps.meta.outputs.tag_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  gh-release:
    name: Create GitHub Release
    needs: [build, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CHANGELOG section for this version
        id: notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          # Extract the section between `## [VERSION]` and the next `## [`.
          awk -v v="[$VERSION]" '
            $0 ~ "^## " v { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "WARNING: no CHANGELOG section for v${VERSION}; using a stub" >&2
            echo "See CHANGELOG.md for details." > release_notes.md
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
