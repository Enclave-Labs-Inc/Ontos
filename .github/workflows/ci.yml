name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so a fast rebase doesn't
# leave a stale run consuming a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint · type-check · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Cache the uv download index + wheel cache across runs on the
          # same branch. Cache key is derived from uv.lock so a lock
          # change forces a clean install.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff (lint)
        run: uv run ruff check ontos tests

      - name: Mypy (strict type-check)
        run: uv run mypy ontos

      - name: Pytest (unit + compliance)
        run: uv run pytest -q -m "not integration and not benchmark"

      - name: Pytest (integration — Neo4j via Testcontainers)
        run: uv run pytest -q -m "integration and not benchmark"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Helm lint (deploy/helm/ontos)
        run: helm lint deploy/helm/ontos

      - name: Helm template renders (deploy/helm/ontos)
        # `--dry-run=client` skips the API server; we just want to
        # prove every template compiles into valid YAML. The chart
        # requires MCP caller auth (#69), so render each supported mode
        # explicitly and assert the bare default still refuses.
        run: |
          helm template ontos deploy/helm/ontos \
            --set auth.issuer=https://idp.example.internal \
            --set auth.audience=ontos \
            --set auth.jwksUri=https://idp.example.internal/jwks > /dev/null
          helm template ontos deploy/helm/ontos \
            --set auth.issuer=https://idp.example.internal \
            --set auth.audience=ontos \
            --set auth.publicKeySecretRef.name=ontos-idp-key > /dev/null
          helm template ontos deploy/helm/ontos \
            --set auth.mode=none \
            --set auth.allowUnauthenticatedBind=true > /dev/null
          if helm template ontos deploy/helm/ontos > /dev/null 2>&1; then
            echo "chart rendered without auth configuration; expected refusal" >&2
            exit 1
          fi

  test-macos-arm64:
    # Apple Silicon reports platform_machine == "arm64", which several
    # wheels' environment markers miss (e.g. greenlet via SQLAlchemy, #58).
    # Linux-only CI stayed green while every export broke on M-series Macs.
    # No Docker on macOS runners, so integration + Helm stay on ubuntu.
    name: test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Pytest (unit + compliance)
        run: uv run pytest -q -m "not integration and not benchmark"
